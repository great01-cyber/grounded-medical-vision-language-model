[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medvlm-grounded"
version = "0.2.0"
description = "Research-grade scaffold for grounded multimodal chest X-ray modelling"
requires-python = ">=3.10"
dependencies = [
  "torch==2.2.2",
  "torchvision==0.17.2",
  "transformers==4.46.3",
  "timm>=1.0",
  "peft>=0.12",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "Pillow>=10",
  "PyYAML>=6",
  "tqdm>=4.66",
  "captum>=0.7",
  "gradio==4.44.1"
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

